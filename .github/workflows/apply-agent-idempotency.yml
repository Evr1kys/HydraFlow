name: Apply Agent idempotency fix

on:
  push:
    branches:
      - fix/agent-concurrent-idempotency

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-concurrent-idempotency
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          git apply --check .github/agent-idempotency.patch
          git apply .github/agent-idempotency.patch
          gofmt -w agent/idempotency.go agent/server.go agent/server_test.go
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/idempotency.go agent/server.go agent/server_test.go
          git commit -m 'fix: serialize concurrent idempotent Agent mutations'
          git push origin HEAD:fix/agent-concurrent-idempotency
