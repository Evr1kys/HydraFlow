name: Format Agent Sources

on:
  push:
    branches: [feat/agent-api-v1]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[agent-gofmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/agent-api-v1
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: Format Agent sources
        run: gofmt -w agent cmd/hydraflow-agent
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agent cmd/hydraflow-agent
          git commit -m "style: gofmt Agent sources [agent-gofmt]"
          git push origin HEAD:feat/agent-api-v1
